<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">
<rect x="0" y="0" width="760" height="424" fill="#12141a" rx="10"/>

<!-- Panel A: unskewed / settle-and-read -->
<text x="16" y="26" fill="#eae8e2" font-size="13" font-weight="600">UNSKEWED — settle-and-read (tests 1-3: hold one vector constant)</text>

<text x="16" y="60" fill="#9a9c9f" font-size="11">row 0</text>
<text x="16" y="100" fill="#9a9c9f" font-size="11">row 1</text>
<text x="16" y="140" fill="#9a9c9f" font-size="11">row 2</text>
<text x="16" y="180" fill="#9a9c9f" font-size="11">row 3</text>

<!-- cycle axis labels for panel A -->
<g font-size="10" fill="#9a9c9f" text-anchor="middle">
<text x="115" y="40">0</text><text x="165" y="40">1</text><text x="215" y="40">2</text>
<text x="265" y="40">3</text><text x="315" y="40">4</text><text x="365" y="40">5</text>
<text x="415" y="40">6</text><text x="465" y="40">7</text><text x="515" y="40">8</text>
<text x="565" y="40">9</text>
</g>

<!-- 4 lanes, cycles 0-6 all show vector 0 held constant (same block across all rows) -->
<g>
  <rect x="90" y="46" width="350" height="152" fill="rgba(249, 115, 22, 0.16)" stroke="#f97316" stroke-width="1"/>
  <text x="265" y="114" fill="#f97316" font-size="11" text-anchor="middle">vector 0 held constant on every row —</text>
  <text x="265" y="132" fill="#f97316" font-size="11" text-anchor="middle">array settles over ~7 cycles</text>
</g>
<!-- gap / reload hatch, cycles 7-9 -->
<rect x="440" y="46" width="150" height="152" fill="none" stroke="#4a4d57" stroke-width="1" stroke-dasharray="3,3"/>
<text x="515" y="128" fill="#6b6e78" font-size="10" text-anchor="middle">gap / reload</text>
<text x="515" y="144" fill="#6b6e78" font-size="10" text-anchor="middle">next row repeats</text>

<line x1="90" y1="46" x2="90" y2="198" stroke="#262a33"/>
<line x1="90" y1="86" x2="590" y2="86" stroke="#262a33"/>
<line x1="90" y1="126" x2="590" y2="126" stroke="#262a33"/>
<line x1="90" y1="166" x2="590" y2="166" stroke="#262a33"/>

<text x="16" y="222" fill="#9a9c9f" font-size="10.5">~7 cycles per vector x 4 vectors, no reload overlap = ~28 cycles for the full 4x4 matmul</text>

<!-- Panel B: skewed streaming -->
<text x="16" y="254" fill="#eae8e2" font-size="13" font-weight="600">SKEWED — continuous streaming (test 4: row i delayed by i cycles, v = s − i)</text>

<text x="16" y="288" fill="#9a9c9f" font-size="11">row 0</text>
<text x="16" y="308" fill="#9a9c9f" font-size="11">row 1</text>
<text x="16" y="328" fill="#9a9c9f" font-size="11">row 2</text>
<text x="16" y="348" fill="#9a9c9f" font-size="11">row 3</text>

<g font-size="10" fill="#9a9c9f" text-anchor="middle">
<text x="115" y="270">0</text><text x="165" y="270">1</text><text x="215" y="270">2</text>
<text x="265" y="270">3</text><text x="315" y="270">4</text><text x="365" y="270">5</text>
<text x="415" y="270">6</text><text x="465" y="270">7</text><text x="515" y="270">8</text>
<text x="565" y="270">9</text>
</g>

<!-- grid -->
<g stroke="#262a33" stroke-width="0.6">
<line x1="90" y1="276" x2="590" y2="276"/>
<line x1="90" y1="296" x2="590" y2="296"/>
<line x1="90" y1="316" x2="590" y2="316"/>
<line x1="90" y1="336" x2="590" y2="336"/>
<line x1="90" y1="356" x2="590" y2="356"/>
</g>

<!-- row 0: vectors 0,1,2,3 at cycles 0-3 -->
<g>
  <rect x="90"  y="280" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="140" y="280" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="190" y="280" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="240" y="280" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <text x="115" y="301" fill="#eae8e2" font-size="11" text-anchor="middle">0</text>
  <text x="165" y="301" fill="#eae8e2" font-size="11" text-anchor="middle">1</text>
  <text x="215" y="301" fill="#eae8e2" font-size="11" text-anchor="middle">2</text>
  <text x="265" y="301" fill="#eae8e2" font-size="11" text-anchor="middle">3</text>
</g>
<!-- row 1: vectors 0,1,2,3 at cycles 1-4 -->
<g>
  <rect x="140" y="300" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="190" y="300" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="240" y="300" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="290" y="300" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <text x="165" y="321" fill="#eae8e2" font-size="11" text-anchor="middle">0</text>
  <text x="215" y="321" fill="#eae8e2" font-size="11" text-anchor="middle">1</text>
  <text x="265" y="321" fill="#eae8e2" font-size="11" text-anchor="middle">2</text>
  <text x="315" y="321" fill="#eae8e2" font-size="11" text-anchor="middle">3</text>
</g>
<!-- row 2: vectors 0,1,2,3 at cycles 2-5 -->
<g>
  <rect x="190" y="320" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="240" y="320" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="290" y="320" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="340" y="320" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <text x="215" y="341" fill="#eae8e2" font-size="11" text-anchor="middle">0</text>
  <text x="265" y="341" fill="#eae8e2" font-size="11" text-anchor="middle">1</text>
  <text x="315" y="341" fill="#eae8e2" font-size="11" text-anchor="middle">2</text>
  <text x="365" y="341" fill="#eae8e2" font-size="11" text-anchor="middle">3</text>
</g>
<!-- row 3: vectors 0,1,2,3 at cycles 3-6 -->
<g>
  <rect x="240" y="340" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="290" y="340" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="340" y="340" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <rect x="390" y="340" width="50" height="32" fill="rgba(45,212,191,0.22)" stroke="#2dd4bf"/>
  <text x="265" y="361" fill="#eae8e2" font-size="11" text-anchor="middle">0</text>
  <text x="315" y="361" fill="#eae8e2" font-size="11" text-anchor="middle">1</text>
  <text x="365" y="361" fill="#eae8e2" font-size="11" text-anchor="middle">2</text>
  <text x="415" y="361" fill="#eae8e2" font-size="11" text-anchor="middle">3</text>
</g>

<!-- output columns landing markers -->
<g stroke="#f97316" stroke-width="1.4" stroke-dasharray="2,2">
<line x1="240" y1="276" x2="240" y2="376"/>
<line x1="290" y1="276" x2="290" y2="376"/>
<line x1="340" y1="276" x2="340" y2="376"/>
<line x1="390" y1="276" x2="390" y2="376"/>
</g>
<text x="16" y="382" fill="#9a9c9f" font-size="9.5">output columns land 3 cycles later (array depth), one per cycle</text>

<text x="16" y="400" fill="#9a9c9f" font-size="10.5">measured (mac_array_tb.cpp test 4): all 4 vectors x 4 output columns</text>
<text x="16" y="415" fill="#9a9c9f" font-size="10.5">land on consecutive cycles — 10 cycles total, genuine 1 result/cycle throughput</text>
</svg>
