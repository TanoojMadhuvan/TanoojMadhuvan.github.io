<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">{% include social-icon.html name="github" %} GitHub</a>
      <span class="dot">&middot;</span>
      <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener">{% include social-icon.html name="linkedin" %} LinkedIn</a>
      <span class="dot">&middot;</span>
      <a href="mailto:{{ site.email }}">{% include social-icon.html name="email" %} {{ site.email }}</a>
    </div>
    <p class="copyright">&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with Jekyll.</p>
  </div>
</footer>
